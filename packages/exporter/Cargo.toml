[package]
name = "factorio_data_exporter"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "0.25.5", default-features = false, features = ["png"] }
futures = "0.3.31"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
reqwest = { version = "0.13.0", features = ["json", "stream"] }
tokio = { version = "1.42.0", features = ["full"] }
regex = "1.11.1"
globset = "0.4.15"
async-recursion = "1.1.1"
lazy_static = "1.5.0"
async-compression = { version = "0.4.18", features = ["tokio", "lzma"] }
indicatif = "0.18"
tokio-tar = { package = "astral-tokio-tar", version = "0.7.0" }
tokio-util = { version = "0.7.13", features = ["io"] }
hyper-staticfile = "0.10.1"
hyper = { version = "1.5.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.10", features = ["tokio"] }
# Deflate only. Every one of the 8,069 entries in Factorio's Windows zip uses
# it, read from the published archive's central directory. The default features
# add zstd, bzip2 and aes, and zstd-sys is a C dependency that refuses a GNU
# compiler when the target is windows-msvc - which is what stopped this crate
# from being checked for Windows off a Linux host.
zip = { version = "8.0.0", default-features = false, features = ["deflate"] }
dotenvy = "0.15.7"