name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip pull requests opened from a fork. GitHub withholds repository secrets
    # from a `pull_request` event raised by a fork, so `CLAUDE_CODE_OAUTH_TOKEN`
    # below resolves to an empty string and the action fails every time. That is
    # not a misconfiguration this workflow can fix - it is what the event is for.
    # Without this guard every fork PR opens with a red X that blocks nothing,
    # which is how a real failure gets missed. Skipped shows grey instead.
    #
    # The alternative is `pull_request_target`, which would hand base-repo
    # secrets to a fork's code. Do not reach for it here: every outside
    # contribution to this repo arrives from a fork.
    #
    # In-repo branches, Renovate's included, still run.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # A review that cannot run anything can only reason about the diff. That
      # is a real limit and it showed: reviewing PR #265 the run said outright
      # that it had no `vp` and no `node_modules`, so it accepted a moved
      # `blueprint-round-trip.spec.ts` fixed point on the strength of the
      # argument rather than by re-running the corpus. These two steps are what
      # the `checks` job in ci.yml does, and they cost it about 1m20s with both
      # caches warm.
      #
      # Deliberately not the Playwright half. That needs browsers and both dev
      # servers, and would put the e2e job's 3-4 minutes on every review
      # including the automatic one on every push. `vp check` and `vp test`
      # cover what a reviewer most often wants to confirm.
      - name: Set up Vite+
        uses: ./.github/actions/setup-vp

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

