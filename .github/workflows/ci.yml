name: CI

on:
  pull_request:
    branches:
      - wormeyman-space-age-support
  push:
    branches:
      - wormeyman-space-age-support
  workflow_dispatch:
    inputs:
      deploy:
        description: Also deploy to Cloudflare after checks pass
        type: boolean
        default: false

# Cancel superseded runs: a newer PR push drops the stale check run, and a newer
# push to the deploy branch cancels an in-flight run (including its deploy job).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: ./.github/actions/setup-vp

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Format check (oxfmt)
        if: ${{ !cancelled() }}
        run: vp fmt . --check

      - name: Lint (oxlint)
        if: ${{ !cancelled() }}
        run: vp lint .

      - name: Tests (vitest - units + gate)
        if: ${{ !cancelled() }}
        run: vp test

      - name: Type-check gate
        if: ${{ !cancelled() }}
        run: npm run type-check:gate

  deploy:
    name: Deploy to Cloudflare
    needs: checks
    # Gate deploys on green checks. Runs on push to the deploy branch, or on a
    # manual dispatch with the deploy input set; never on pull requests.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: ./.github/actions/setup-vp

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build website
        run: npm run build:website

      - name: Install worker dependencies
        run: npm ci
        working-directory: packages/worker

      - name: Deploy worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: packages/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
