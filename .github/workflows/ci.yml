name: CI

on:
  pull_request:
    branches:
      - wormeyman-space-age-support
  push:
    branches:
      - wormeyman-space-age-support
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Vite+ toolchain
        uses: actions/cache@v4
        with:
          path: ~/.vite-plus
          key: vite-plus-${{ runner.os }}-0.2.1

      - name: Install vp
        run: |
          # Pin + verify the installer instead of curl | bash. The vp binary and
          # vite-plus package are already version-pinned (VP_VERSION) and immutable
          # via the npm registry; this also pins the mutable bootstrap script. Bump
          # VP_INSTALLER_SHA256 when intentionally upgrading the toolchain.
          curl -fsSL https://vite.plus -o vp-install.sh
          echo "6f4fe3690a3f011b4b6cec3c71035e9c04a97dd45dd9e2623dc67f842268f0d2  vp-install.sh" | sha256sum -c -
          VP_VERSION=0.2.1 VP_NODE_MANAGER=yes bash vp-install.sh
          echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"
          rm -f vp-install.sh

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Format check (oxfmt)
        if: ${{ !cancelled() }}
        run: vp fmt . --check

      - name: Lint (oxlint)
        if: ${{ !cancelled() }}
        run: vp lint .

      - name: Tests (vitest - units + gate)
        if: ${{ !cancelled() }}
        run: vp test

      - name: Type-check gate
        if: ${{ !cancelled() }}
        run: npm run type-check:gate
