name: CI

on:
  pull_request:
    branches:
      - wormeyman-space-age-support
  push:
    branches:
      - wormeyman-space-age-support
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check (prettier)
        if: ${{ !cancelled() }}
        run: npm run format

      - name: Lint (eslint)
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Gate unit tests (scripts)
        if: ${{ !cancelled() }}
        run: npm run test:scripts

      - name: Unit tests (editor)
        if: ${{ !cancelled() }}
        run: npm run test:unit

      - name: Type-check gate
        if: ${{ !cancelled() }}
        run: npm run type-check:gate
