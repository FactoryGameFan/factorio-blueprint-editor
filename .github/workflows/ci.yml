name: CI

# WHY THIS FILE LOOKS LIKE THIS: .github/workflows/README.md
#
# That doc holds the measurements, the things that were tried and rejected, and
# the parts that look simplifiable but are not. The comments kept below are only
# the ones sited where a reader is about to undo the thing they protect.

on:
  pull_request:
    branches:
      - wormeyman-space-age-support
  push:
    branches:
      - wormeyman-space-age-support
  workflow_dispatch:
    inputs:
      deploy:
        description: Also deploy to Cloudflare after checks pass
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Skips jobs that cannot see the change. A job-level `if:` rather than
  # `on.pull_request.paths` on purpose: a skipped WORKFLOW never reports, a
  # skipped JOB does. But a skipped MATRIX job reports one unexpanded name, so
  # `Playwright 1/4` must never be marked a required check. See README.md.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.detect.outputs.web }}
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - name: List changed files and classify them
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -uo pipefail

          # Anything that is not a pull request - a push to the deploy branch, a
          # manual dispatch - runs the lot. `deploy` is gated on `checks` and
          # `e2e`, so narrowing either one here would change when the site ships.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request. Running every job."
            echo "web=true"  >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if [ -z "$files" ]; then
            echo "Could not list the changed files. Running every job."
            echo "web=true"  >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$files"

          # `rust` covers the exporter crate, plus this workflow itself, so a
          # change to these rules is always tested against both sides.
          if echo "$files" | grep --quiet --extended-regexp '^packages/exporter/|^\.github/workflows/ci\.yml$'; then
            rust=true
          else
            rust=false
          fi

          # `web` is deliberately the loose one: anything at all outside the
          # exporter turns it on. That runs `checks` and Playwright for a
          # README-only change, which wastes a few minutes and cannot miss a
          # real one.
          if echo "$files" | grep --quiet --invert-match '^packages/exporter/'; then
            web=true
          else
            web=false
          fi

          echo "web=$web"   >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "Decided: web=$web rust=$rust"

  checks:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Vite+
        uses: ./.github/actions/setup-vp

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check (oxfmt + oxlint + tsc)
        if: ${{ !cancelled() }}
        run: vp check .

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: vp test

  rust:
    name: Rust exporter
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Record toolchain
        run: cargo --version && rustc --version

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/exporter/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/exporter/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build
        run: cargo build --locked --manifest-path packages/exporter/Cargo.toml

      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --check --manifest-path packages/exporter/Cargo.toml

      # `-D warnings` is load-bearing: plain `cargo clippy` exits 0 with warnings.
      # Gates on Linux deliberately - it reports 2 warnings on a Mac and the Mac
      # is the one that is wrong. Do not silence them locally. See README.md.
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path packages/exporter/Cargo.toml -- -D warnings

  # A NATIVE runner, not `cargo check --target x86_64-pc-windows-msvc`, which
  # fails: `zstd-sys` refuses the GNU compiler for an msvc target. The
  # cross-check was committed and CI rejected it. See README.md.
  rust-windows:
    name: Rust exporter (Windows)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Record toolchain
        run: cargo --version && rustc --version

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/exporter/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/exporter/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build
        run: cargo build --locked --manifest-path packages/exporter/Cargo.toml

  e2e:
    name: Playwright ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Sharding is the lever, not `workers`. playwright.config.ts pins
    # `workers: 1` because the specs share ports 8080/8081, and that clash is
    # within a machine. See README.md.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Vite+
        uses: ./.github/actions/setup-vp

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # This REPLACED `playwright install-deps` rather than retrying it. Do not
      # reintroduce it, and do not wrap it in `timeout`: that kills npx while the
      # root-owned apt-get keeps the lock. `expected=2` is part of the assertion,
      # not a guess. See README.md.
      - name: Verify chromium's shared libraries (no apt)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          expected=2
          found=0
          bad=0
          while IFS= read -r bin; do
            found=$((found + 1))
            echo "--- $bin"
            if ldd "$bin" | grep -F 'not found'; then
              echo "::error::$bin is missing the shared libraries listed above"
              bad=$((bad + 1))
            fi
          done < <(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \))
          echo "probed $found chromium binaries; $bad with missing libraries"
          if [ "$found" -lt "$expected" ]; then
            echo "::error::expected at least $expected chromium binaries, found $found - the browser layout changed, so this check is no longer looking at what the specs run"
            exit 1
          fi
          [ "$bad" -eq 0 ]

      - name: Start dev servers
        run: nohup npm run localpreview > /tmp/localpreview.log 2>&1 &

      - name: Wait for both servers
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080 \
              && curl -sf -o /dev/null http://localhost:8081; then
              echo "both servers up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "servers did not come up within 60s" >&2
          echo "--- localpreview log ---" >&2
          cat /tmp/localpreview.log >&2 || true
          exit 1

      - name: Run Playwright specs
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            /tmp/localpreview.log
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    # Both gates, not just `checks`. Merging to this branch deploys to
    # fbe.factorygamefan.com, so treat it as a release. See README.md.
    needs: [checks, e2e]
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Vite+
        uses: ./.github/actions/setup-vp

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build website
        run: npm run build:website

      - name: Deploy worker to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: packages/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
