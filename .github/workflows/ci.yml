name: CI

on:
  pull_request:
    branches:
      - wormeyman-space-age-support
  push:
    branches:
      - wormeyman-space-age-support
  workflow_dispatch:
    inputs:
      deploy:
        description: Also deploy to Cloudflare after checks pass
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Vite+
        uses: ./.github/actions/setup-vp

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check (oxfmt + oxlint + tsc)
        if: ${{ !cancelled() }}
        run: vp check .

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: vp test

  rust:
    name: Rust exporter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Record toolchain
        run: cargo --version && rustc --version

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/exporter/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/exporter/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build
        run: cargo build --locked --manifest-path packages/exporter/Cargo.toml

      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --check --manifest-path packages/exporter/Cargo.toml

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path packages/exporter/Cargo.toml -- -D warnings

  rust-windows:
    name: Rust exporter (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Record toolchain
        run: cargo --version && rustc --version

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/exporter/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/exporter/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build
        run: cargo build --locked --manifest-path packages/exporter/Cargo.toml

  e2e:
    name: Playwright ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Vite+
        uses: ./.github/actions/setup-vp

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify chromium's shared libraries (no apt)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          expected=2
          found=0
          bad=0
          while IFS= read -r bin; do
            found=$((found + 1))
            echo "--- $bin"
            if ldd "$bin" | grep -F 'not found'; then
              echo "::error::$bin is missing the shared libraries listed above"
              bad=$((bad + 1))
            fi
          done < <(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \))
          echo "probed $found chromium binaries; $bad with missing libraries"
          if [ "$found" -lt "$expected" ]; then
            echo "::error::expected at least $expected chromium binaries, found $found - the browser layout changed, so this check is no longer looking at what the specs run"
            exit 1
          fi
          [ "$bad" -eq 0 ]

      - name: Start dev servers
        run: nohup npm run localpreview > /tmp/localpreview.log 2>&1 &

      - name: Wait for both servers
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080 \
              && curl -sf -o /dev/null http://localhost:8081; then
              echo "both servers up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "servers did not come up within 60s" >&2
          echo "--- localpreview log ---" >&2
          cat /tmp/localpreview.log >&2 || true
          exit 1

      - name: Run Playwright specs
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            /tmp/localpreview.log
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: [checks, e2e]
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Vite+
        uses: ./.github/actions/setup-vp

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build website
        run: npm run build:website

      - name: Deploy worker to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: packages/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
