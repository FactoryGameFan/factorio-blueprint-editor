name: CI

on:
  pull_request:
    branches:
      - wormeyman-space-age-support
  push:
    branches:
      - wormeyman-space-age-support
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Vite+ toolchain
        uses: actions/cache@v4
        with:
          path: ~/.vite-plus
          key: vite-plus-${{ runner.os }}-0.2.1

      - name: Install vp
        run: |
          VP_VERSION=0.2.1 VP_NODE_MANAGER=yes curl -fsSL https://vite.plus | bash
          echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: vp install

      - name: Format check (oxfmt)
        if: ${{ !cancelled() }}
        run: vp fmt . --check

      - name: Lint (oxlint)
        if: ${{ !cancelled() }}
        run: vp lint .

      - name: Tests (vitest: units + gate)
        if: ${{ !cancelled() }}
        run: vp test

      - name: Type-check gate
        if: ${{ !cancelled() }}
        run: npm run type-check:gate
