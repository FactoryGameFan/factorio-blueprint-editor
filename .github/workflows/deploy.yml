name: Deploy to Cloudflare

on:
  push:
    branches:
      - wormeyman-space-age-support
  workflow_dispatch:

# Avoid overlapping deploys; cancel an in-progress run when a newer push lands.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Vite+ toolchain
        uses: actions/cache@v6
        with:
          path: ~/.vite-plus
          key: vite-plus-${{ runner.os }}-0.2.1

      - name: Install vp
        run: |
          # Pin + verify the installer instead of curl | bash. The vp binary and
          # vite-plus package are already version-pinned (VP_VERSION) and immutable
          # via the npm registry; this also pins the mutable bootstrap script. Bump
          # VP_INSTALLER_SHA256 when intentionally upgrading the toolchain.
          curl -fsSL https://vite.plus -o vp-install.sh
          echo "6f4fe3690a3f011b4b6cec3c71035e9c04a97dd45dd9e2623dc67f842268f0d2  vp-install.sh" | sha256sum -c -
          VP_VERSION=0.2.1 VP_NODE_MANAGER=yes bash vp-install.sh
          echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"
          rm -f vp-install.sh

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Build website
        run: npm run build:website

      - name: Deploy worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: packages/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
