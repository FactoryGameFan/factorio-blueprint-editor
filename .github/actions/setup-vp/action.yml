name: Setup Vite+
description: >-
  Install the pinned, checksum-verified Vite+ toolchain (vp) and prime the npm
  download cache. After this runs, vp is on PATH; the caller runs its own
  vp install. Single source of truth for the vp version + installer checksum.

runs:
  using: composite
  steps:
    - name: Cache Vite+ toolchain
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.vite-plus
        key: vite-plus-${{ runner.os }}-0.2.6

    - name: Cache npm downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Install vp
      shell: bash
      run: |
        # Pin + verify the installer instead of curl | bash. The vp binary and
        # vite-plus package are already version-pinned (VP_VERSION) and immutable
        # via the npm registry; this also pins the mutable bootstrap script. Bump
        # the VP_VERSION (here + the cache key above) and the checksum together
        # when intentionally upgrading the toolchain.
        curl -fsSL https://vite.plus -o vp-install.sh
        echo "58bb052c6a007e662e99667d65686251b16d6b39aa21155487da6d51280b3d54  vp-install.sh" | sha256sum -c -
        VP_VERSION=0.2.6 VP_NODE_MANAGER=yes bash vp-install.sh
        echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"
        rm -f vp-install.sh
